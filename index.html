<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        color: #333;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        transition: 0.3s;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #007BFF;
        outline: none;
    }

    .error {
        color: red;
        font-size: 12px;
    }

    .invalid {
        border: 2px solid red;
    }

    button {
        width: 100%;
        background: #007BFF;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    @media(max-width:600px){
        .container {margin: 10px;}
    }
</style>
</head>

<body>

<div class="container">
<h2>Job Registration Form</h2>

<form id="jobForm">

<!-- Personal Info -->
<div class="form-group">
<label>Full Name</label>
<input type="text" id="name">
<div class="error" id="nameError"></div>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email">
<div class="error" id="emailError"></div>
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" id="phone">
<div class="error" id="phoneError"></div>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob">
<div class="error" id="dobError"></div>
</div>

<!-- Address -->
<div class="form-group">
<label>Country</label>
<select id="country"></select>
</div>

<div class="form-group">
<label>Province</label>
<select id="province"></select>
</div>

<div class="form-group">
<label>City</label>
<select id="city"></select>
</div>

<div class="form-group">
<label>District</label>
<select id="district"></select>
</div>

<!-- Job Details -->
<div class="form-group">
<label>Position Applied</label>
<input type="text" id="position">
<div class="error" id="positionError"></div>
</div>

<div class="form-group">
<label>Experience (Years)</label>
<input type="number" id="experience">
<div class="error" id="expError"></div>
</div>

<div class="form-group">
<label>Skills</label>
<textarea id="skills"></textarea>
<div class="error" id="skillsError"></div>
</div>

<div class="form-group">
<label>Upload Resume</label>
<input type="file" id="resume">
<div class="error" id="resumeError"></div>
</div>

<button type="submit">Submit Application</button>

</form>
</div>

<script>
// ✅ Simulated API Data (You can replace with real API)
const data = {
    Pakistan: {
        Punjab: {
            Lahore: ["Model Town", "Johar Town"],
            Faisalabad: ["Jinnah Town", "Madina Town"]
        },
        Sindh: {
            Karachi: ["District East", "District West"],
            Hyderabad: ["Latifabad", "Qasimabad"]
        }
    }
};

// Populate Country
const countryEl = document.getElementById("country");
const provinceEl = document.getElementById("province");
const cityEl = document.getElementById("city");
const districtEl = document.getElementById("district");

function loadCountries() {
    countryEl.innerHTML = "<option value=''>Select Country</option>";
    for (let c in data) {
        countryEl.innerHTML += `<option value="${c}">${c}</option>`;
    }
}

countryEl.onchange = () => {
    provinceEl.innerHTML = "<option>Select Province</option>";
    cityEl.innerHTML = "";
    districtEl.innerHTML = "";

    for (let p in data[countryEl.value]) {
        provinceEl.innerHTML += `<option value="${p}">${p}</option>`;
    }
};

provinceEl.onchange = () => {
    cityEl.innerHTML = "<option>Select City</option>";
    districtEl.innerHTML = "";

    for (let c in data[countryEl.value][provinceEl.value]) {
        cityEl.innerHTML += `<option value="${c}">${c}</option>`;
    }
};

cityEl.onchange = () => {
    districtEl.innerHTML = "<option>Select District</option>";

    let districts = data[countryEl.value][provinceEl.value][cityEl.value];
    districts.forEach(d => {
        districtEl.innerHTML += `<option value="${d}">${d}</option>`;
    });
};

loadCountries();

// ✅ Validation
function validate() {
    let valid = true;

    function setError(id, message) {
        document.getElementById(id).classList.add("invalid");
        document.getElementById(id + "Error").innerText = message;
        valid = false;
    }

    function clearError(id) {
        document.getElementById(id).classList.remove("invalid");
        document.getElementById(id + "Error").innerText = "";
    }

    // Name
    let name = document.getElementById("name").value.trim();
    if (!/^[A-Za-z ]{3,}$/.test(name)) {
        setError("name", "Enter valid name (min 3 letters)");
    } else clearError("name");

    // Email
    let email = document.getElementById("email").value;
    if (!/^\S+@\S+\.\S+$/.test(email)) {
        setError("email", "Enter valid email");
    } else clearError("email");

    // Phone
    let phone = document.getElementById("phone").value;
    if (!/^[0-9]{10,15}$/.test(phone)) {
        setError("phone", "Enter valid phone number");
    } else clearError("phone");

    // DOB
    if (!document.getElementById("dob").value) {
        setError("dob", "Required");
    } else clearError("dob");

    // Position
    if (document.getElementById("position").value.trim() === "") {
        setError("position", "Required");
    } else clearError("position");

    // Experience
    let exp = document.getElementById("experience").value;
    if (exp === "" || exp < 0) {
        setError("experience", "Enter valid experience");
    } else clearError("experience");

    // Skills
    if (document.getElementById("skills").value.trim() === "") {
        setError("skills", "Required");
    } else clearError("skills");

    // Resume
    if (!document.getElementById("resume").files.length) {
        setError("resume", "Upload resume");
    } else clearError("resume");

    return valid;
}

// ✅ Submit
document.getElementById("jobForm").addEventListener("submit", function(e){
    e.preventDefault();

    if (validate()) {
        alert("Form submitted successfully ✅");
    }
});
</script>

</body>
</html>
